<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&amp;family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;display=swap" rel="stylesheet"/>
<style>
/*
  kn.css - canonical stylesheet of the Khang Nguyên · Ngọc Bảo design system (light, sunlit, oriental).
  Source of truth for tokens and components. Spec: docs/design-brief-khang-nguyen-ngoc-bao.md
  Rules enforced by docs/design/check-design.py:
  - Hex colors exist ONLY inside :root below. Everywhere else use var(--kn-*).
  - Class and custom property names use the kn- prefix.
  - No box-shadow. No dark page backgrounds. Radius only via the values listed in the spec.
*/
:root{
  /* light surfaces: sunlit cream, white, sun wash, jade mist */
  --kn-canvas:#fbf8ef;--kn-white:#ffffff;--kn-sun:#fcf1cc;
  --kn-jade-mist:#e4f0e9;--kn-jade-soft:#c5e0d1;
  /* jade (bích ngọc): actions and headings */
  --kn-jade:#0e6b57;--kn-jade-deep:#06483a;
  /* gold and red accents */
  --kn-gold:#c29a3e;--kn-gold-ink:#7d5f17;--kn-crimson:#9b1c2c;--kn-danger:#a3202f;
  /* text and lines */
  --kn-ink:#14221d;--kn-body:#3d4a44;--kn-muted:#5c6963;--kn-line:#e5e0cf;--kn-line-strong:#c9c4ae;
  /* type */
  --kn-serif:"Cormorant Garamond","Times New Roman",serif;
  --kn-sans:"Be Vietnam Pro",Arial,sans-serif;
  /* layout */
  --kn-pad:32px;--kn-wrap:1216px;
}

/* base */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body.kn{margin:0;background:var(--kn-canvas);color:var(--kn-ink);font:400 16px/1.6 var(--kn-sans);-webkit-font-smoothing:antialiased}
/* :where() keeps base rules at zero specificity so component classes always win */
.kn :where(img){display:block;max-width:100%;height:auto}
.kn :where(a){color:inherit;text-decoration:none}
.kn :where(button){font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.kn :focus-visible{outline:2px solid var(--kn-jade-deep);outline-offset:3px}
.kn em{font-style:italic}
.kn :where(h1,h2,h3){font-family:var(--kn-serif);font-weight:500;margin:0;letter-spacing:.005em;color:var(--kn-jade-deep);text-wrap:balance}
.kn h1 em,.kn h2 em{color:var(--kn-gold-ink)}
.kn-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.kn-wrap{max-width:var(--kn-wrap);margin:0 auto;padding:0 var(--kn-pad)}
.kn-eyebrow{font:600 12px/1 var(--kn-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--kn-gold-ink);margin:0 0 20px}
.kn-lead{color:var(--kn-body);font-size:18px;line-height:1.6;margin:0 0 28px;max-width:460px}
.kn-muted{color:var(--kn-muted)}
.kn-ornament{display:block;width:160px;height:16px;margin:0 auto 24px;color:var(--kn-gold)}

/* navigation */
.kn-nav{position:sticky;top:0;z-index:20;background:rgba(251,248,239,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--kn-line)}
.kn-nav .kn-wrap{height:68px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.kn-brand{display:flex;align-items:center;gap:14px;color:var(--kn-jade-deep)}
.kn-brand svg{width:44px;height:44px;margin:0;flex:none}
.kn-brand>span{display:grid;gap:4px;font:600 24px/1 var(--kn-serif)}
.kn-brand small{display:block;font:600 11px/1 var(--kn-sans);color:var(--kn-gold-ink);letter-spacing:.16em}
.kn-nav__links{display:flex;gap:28px;list-style:none;margin:0;padding:0;font-size:14px;color:var(--kn-body)}
.kn-nav__links a:hover{color:var(--kn-jade)}
.kn-bag{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:1px solid var(--kn-line-strong);border-radius:9999px;background:var(--kn-white);font-size:14px;font-weight:500;color:var(--kn-jade-deep);transition:border-color .2s}
.kn-bag:hover{border-color:var(--kn-jade)}
.kn-badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9999px;background:var(--kn-gold);color:var(--kn-ink);font-size:11px;font-weight:600}

/* buttons and text actions */
.kn-btn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;padding:0 32px;border-radius:9999px;background:var(--kn-jade);color:var(--kn-white);font-weight:500;font-size:15px;letter-spacing:.01em;transition:background .25s}
.kn-btn:hover,.kn-btn.is-hover{background:var(--kn-jade-deep)}
.kn-btn.is-focus{outline:2px solid var(--kn-jade-deep);outline-offset:3px}
.kn-btn:disabled,.kn-btn[aria-disabled="true"]{background:var(--kn-line);color:var(--kn-muted);cursor:not-allowed}
.kn-btn--inline{display:inline-flex;width:auto}
.kn-btn--ghost{background:transparent;color:var(--kn-jade-deep);border:1px solid var(--kn-jade);height:46px}
.kn-btn--ghost:hover,.kn-btn--ghost.is-hover{background:var(--kn-jade-mist)}
.kn-more{display:inline-flex;align-items:center;gap:8px;padding-bottom:4px;border-bottom:1px solid currentColor;font:600 15px/1.3 var(--kn-sans);color:var(--kn-jade-deep);transition:gap .3s,color .3s}
.kn-more::after{content:"\2192";content:"\2192" / ""}
.kn-more:hover,.kn-more.is-hover,a:hover>.kn-more{gap:14px;color:var(--kn-jade)}
.kn-note{min-height:24px;margin:10px 0 0;font-size:13px;color:var(--kn-jade)}

/* form fields */
.kn-field{display:grid;gap:8px;margin:0 0 20px}
.kn-field label{font-size:13px;color:var(--kn-body)}
.kn-field--flush{margin:0;min-width:200px}
.kn-input{width:100%;height:48px;padding:0 16px;border-radius:10px;border:1px solid var(--kn-line-strong);background:var(--kn-white);color:var(--kn-ink);font:400 16px/1 var(--kn-sans)}
.kn-input::placeholder{color:var(--kn-muted)}
.kn-input:focus,.kn-input.is-focus{border-color:var(--kn-jade);outline:2px solid var(--kn-jade-deep);outline-offset:3px}
.kn-input.is-error{border-color:var(--kn-crimson)}
.kn-input:disabled{background:var(--kn-line);color:var(--kn-muted);cursor:not-allowed}
.kn-error{margin:0;font-size:13px;color:var(--kn-danger)}
.kn-alert{display:flex;gap:12px;padding:16px 20px;border-radius:10px;border:1px solid var(--kn-crimson);background:var(--kn-white);color:var(--kn-danger);font-size:14px}
.kn-empty{padding:64px 24px;text-align:center;background:var(--kn-white);border:1px solid var(--kn-line);border-radius:20px}
.kn-empty h3{font-size:30px;margin-bottom:8px}
.kn-empty p{margin:0 0 24px;color:var(--kn-body)}
.kn-chips{display:flex;flex-wrap:wrap;gap:8px}
.kn-chip{display:inline-flex;align-items:center;height:38px;padding:0 18px;border-radius:9999px;border:1px solid var(--kn-line-strong);background:var(--kn-white);font-size:14px;color:var(--kn-body);transition:border-color .2s,background .2s}
.kn-chip:hover,.kn-chip.is-hover{border-color:var(--kn-jade);color:var(--kn-jade-deep)}
.kn-chip[aria-pressed="true"],.kn-chip.is-active{background:var(--kn-jade);border-color:var(--kn-jade);color:var(--kn-white);font-weight:500}
.kn-tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:9999px;border:1px solid var(--kn-gold);color:var(--kn-gold-ink);font:600 11px/1 var(--kn-sans);letter-spacing:.04em;text-transform:uppercase}

/* product stage */
.kn-stage{padding:40px 0 96px}
.kn-stage .kn-wrap{display:grid;grid-template-columns:7fr 5fr;gap:64px;align-items:start}
.kn-crumb{grid-column:1/-1;font-size:13px;color:var(--kn-muted)}
.kn-crumb a:hover{color:var(--kn-jade)}
.kn-crumb--page{padding-top:24px}
.kn-shot{margin:0;padding:12px;background:var(--kn-white);border:1px solid var(--kn-line);border-radius:20px}
.kn-shot img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 88%;border-radius:10px}
.kn-buy{position:sticky;top:96px}
.kn-buy h1{font-size:56px;line-height:1.05;margin-bottom:20px}
.kn-price{margin:0 0 4px;font:600 32px/1.1 var(--kn-sans);letter-spacing:-.01em;color:var(--kn-jade-deep)}
.kn-once{margin:0 0 20px;color:var(--kn-muted);font-size:13px}
.kn-buy .kn-more{margin:12px 0 28px}

/* accordion */
.kn-acc{border-top:1px solid var(--kn-line-strong)}
.kn-acc:last-of-type{border-bottom:1px solid var(--kn-line-strong)}
.kn-acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:18px 0;font-size:16px;font-weight:500;cursor:pointer}
.kn-acc summary::-webkit-details-marker{display:none}
.kn-acc summary::after{content:"+";font-size:22px;line-height:1;color:var(--kn-gold-ink)}
.kn-acc[open] summary::after{content:"\2212"}
.kn-acc>div{padding:0 0 18px;color:var(--kn-body);font-size:15px}
.kn-acc p{margin:0 0 8px}
.kn-spec{display:grid;grid-template-columns:140px 1fr;gap:8px 16px;margin:0}
.kn-spec dt{color:var(--kn-muted)}
.kn-spec dd{margin:0;color:var(--kn-ink)}

/* home hero: sunlit cream with a framed photograph */
.kn-hero{position:relative;margin:24px var(--kn-pad) 0;border-radius:24px;overflow:hidden;background:var(--kn-jade)}
.kn-carousel__track{display:flex;height:clamp(440px,44vw,640px);margin:0;padding:0;list-style:none;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none}
.kn-carousel__track::-webkit-scrollbar{display:none}
.kn-carousel__track:focus-visible{outline-offset:-4px}
.kn-hero :focus-visible{outline-color:var(--kn-gold)}
.kn-slide{position:relative;flex:0 0 100%;min-width:0;scroll-snap-align:start}
.kn-slide>img{position:absolute;top:0;left:0;width:100%;height:100%;max-width:1050px;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,1) 82%,rgba(0,0,0,0));mask-image:linear-gradient(90deg,rgba(0,0,0,1) 82%,rgba(0,0,0,0))}
/* never enlarge a photo beyond its own pixels; a narrower photo sits left on the brand colour */
.kn-slide:nth-child(3)>img{max-width:960px}
.kn-slide:nth-child(5)>img{max-width:720px}
.kn-slide:nth-child(1)>img{object-position:50% 52%}
.kn-slide:nth-child(2)>img{object-position:50% 55%}
.kn-slide:nth-child(3)>img{object-position:50% 58%}
.kn-slide:nth-child(4)>img{object-position:50% 40%}
.kn-slide:nth-child(5)>img{object-position:50% 100%}
.kn-slide::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(270deg,rgba(20,34,29,.88) 0,rgba(20,34,29,.8) 46%,rgba(20,34,29,0) 78%)}
.kn-slide__copy{position:absolute;z-index:1;top:0;right:0;bottom:0;width:min(50%,640px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 104px 0 24px;color:var(--kn-white)}
.kn-slide__copy .kn-eyebrow{margin:0 0 16px;color:var(--kn-white)}
.kn-slide__copy :is(h1,h2){font:500 54px/1.04 var(--kn-serif);margin:0 0 16px;color:var(--kn-white)}
.kn .kn-slide__copy em{color:var(--kn-sun)}
.kn-slide__sub{margin:0 0 28px;max-width:420px;font-size:17px;line-height:1.55;color:var(--kn-white)}
.kn-slide__copy .kn-btn{background:var(--kn-white);color:var(--kn-jade-deep)}
.kn-slide__copy .kn-btn:hover{background:var(--kn-sun)}
.kn-carousel__bar{position:absolute;inset:0;z-index:2;pointer-events:none}
.kn-carousel__nav{position:absolute;top:50%;margin-top:-22px;display:grid;place-items:center;width:44px;height:44px;border-radius:9999px;background:var(--kn-white);color:var(--kn-jade-deep);cursor:pointer;pointer-events:auto;transition:background .3s}
.kn-carousel__nav[data-dir="-1"]{left:16px}
.kn-carousel__nav[data-dir="1"]{right:16px}
.kn-carousel__nav:hover{background:var(--kn-sun)}
.kn-carousel__nav svg{width:20px;height:20px}
.kn-carousel__dots{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;padding:0 8px;border-radius:9999px;background:rgba(20,34,29,.55);pointer-events:auto}
.kn-carousel__dot{position:relative;width:28px;height:36px;padding:0;border:0;background:transparent;cursor:pointer}
.kn-carousel__dot::before{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:9999px;background:var(--kn-line-strong);transition:width .3s,margin .3s,background .3s}
.kn-carousel__dot[aria-current="true"]::before{width:24px;margin-left:-12px;background:var(--kn-white)}
@media (prefers-reduced-motion:reduce){.kn-carousel__track{scroll-behavior:auto}.kn-carousel__dot::before,.kn-more,.kn-carousel__nav{transition:none}}

/* editorial spread: photograph beside a flat jade-mist field */
.kn-spread{background:var(--kn-jade-mist);color:var(--kn-ink)}
.kn-spread__inner{display:grid;grid-template-columns:1fr 1fr;max-width:1440px;margin:0 auto}
.kn-spread figure{margin:0;min-height:100%;overflow:hidden}
.kn-spread figure img{width:100%;height:100%;object-fit:cover;object-position:50% 100%;min-height:520px;transform:scale(1.3);transform-origin:50% 100%}
.kn-spread--flip figure{order:2}
.kn-story{padding:80px 64px;display:flex;flex-direction:column;justify-content:center;gap:28px}
.kn-story .kn-eyebrow{margin:0}
.kn-story h2{font-size:48px;line-height:1.08}
.kn-story p{margin:0;font:500 20px/1.45 var(--kn-serif);color:var(--kn-body);max-width:520px}
.kn-story .kn-more{justify-self:start}
.kn-table{width:100%;border-collapse:collapse;font-size:14px;background:var(--kn-white);border-radius:10px;overflow:hidden}
.kn-table th,.kn-table td{text-align:left;vertical-align:top;padding:14px 16px;border-top:1px solid var(--kn-line)}
.kn-table thead th{border-top:0;font:600 12px/1.2 var(--kn-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--kn-gold-ink);background:var(--kn-white)}
.kn-table tbody th{width:28%;font-weight:600;font-size:13px;color:var(--kn-jade-deep)}
.kn-caveat{font:italic 500 20px/1.4 var(--kn-serif);border-left:2px solid var(--kn-crimson);padding-left:16px;max-width:520px;color:var(--kn-ink)}

/* shelf of products: unboxed cards on cream */
.kn-shelf{padding:96px 0}
.kn-shelf__head{display:flex;align-items:center;justify-content:center;gap:24px;padding:0 var(--kn-pad);text-align:center;font:italic 500 22px/1.25 var(--kn-serif);color:var(--kn-jade-deep);text-transform:uppercase;letter-spacing:.04em}
.kn-shelf__head::before,.kn-shelf__head::after{content:"";flex:1;max-width:200px;height:1px;background:var(--kn-gold)}
.kn-shelf__head span{font:400 12px/1 var(--kn-sans);font-style:normal;color:var(--kn-muted);margin-left:12px;letter-spacing:.04em}
.kn-cells{display:grid;grid-template-columns:repeat(3,1fr);gap:40px 24px;max-width:var(--kn-wrap);margin:40px auto 0;padding:0 var(--kn-pad)}
.kn-cell{display:flex;flex-direction:column;gap:16px}
.kn-cell img{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:50% 100%;border-radius:20px;border:1px solid var(--kn-line);transition:opacity .25s}
.kn-cell div{display:flex;flex-direction:column;gap:4px;padding:0 4px}
.kn-cell h3{font-size:26px;line-height:1.15}
.kn-cell p{margin:0;font-weight:600;font-size:15px;color:var(--kn-jade-deep)}
.kn-cell:hover img{opacity:.9}
.kn-cell:hover h3{text-decoration:underline;text-decoration-color:var(--kn-gold);text-underline-offset:6px}
.kn-toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:24px 0}
.kn-page-title{padding:48px 0 8px}
.kn-page-title h1{font-size:56px;line-height:1.05}
.kn-page-title p{margin:12px 0 0;color:var(--kn-body);max-width:576px}
.kn-more{text-align:center;padding:48px 0 0}
.kn-prose{max-width:576px;margin:0 auto;padding:64px var(--kn-pad) 0;color:var(--kn-body);font-size:15px}

/* cart and checkout. Rule: a product price always sits directly under the product name. */
.kn-narrow{max-width:1100px;margin:0 auto;padding:24px var(--kn-pad) 0}
.kn-cart{display:grid;grid-template-columns:1fr 360px;gap:48px;align-items:start;padding-top:24px}
.kn-cart>aside{position:sticky;top:96px}
.kn-lines{list-style:none;margin:0;padding:0}
.kn-lines .kn-line:last-child{border-bottom:1px solid var(--kn-line)}
.kn-line{display:grid;grid-template-columns:88px 1fr;gap:20px;align-items:center;padding:20px 0;border-top:1px solid var(--kn-line)}
.kn-line img{width:88px;aspect-ratio:1/1;object-fit:cover;object-position:50% 100%;border-radius:10px}
.kn-line h3{font-size:22px}
.kn-line__meta{margin:4px 0 8px;font-size:13px;color:var(--kn-muted)}
.kn-line__price{margin:2px 0 4px;color:var(--kn-jade-deep);font-weight:600}
.kn-link{display:inline-block;font-size:13px;color:var(--kn-body);text-decoration:underline;text-underline-offset:4px}
.kn-link:hover{color:var(--kn-jade)}
.kn-summary{padding:24px;background:var(--kn-white);border:1px solid var(--kn-line);border-radius:20px}
.kn-summary h2{font-size:28px;margin-bottom:16px}
.kn-summary p{display:flex;justify-content:space-between;margin:0 0 12px}
.kn-summary .kn-total{margin-top:4px;padding-top:16px;border-top:1px solid var(--kn-line);font-size:18px}
.kn-summary .kn-btn{margin:16px 0 12px}
.kn-summary small{display:block;color:var(--kn-muted);font-size:13px}
.kn-mini{list-style:none;margin:0 0 16px;padding:0}
.kn-mini li{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--kn-line);font-size:14px}
.kn-mini li span:last-child{color:var(--kn-jade-deep);font-weight:600}
.kn-form h2{font-size:28px;margin:40px 0 20px}
.kn-form h2:first-child{margin-top:0}
.kn-form__row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kn-choice{display:flex;align-items:center;gap:12px;padding:16px;margin:0 0 12px;background:var(--kn-white);border:1px solid var(--kn-line-strong);border-radius:10px;cursor:pointer;font-size:15px}
.kn-choice:hover{border-color:var(--kn-jade)}
.kn-choice:has(input:checked){border-color:var(--kn-jade);background:var(--kn-jade-mist)}
.kn-choice input{width:18px;height:18px;accent-color:var(--kn-jade)}

/* sunrise call to action: cream to sun wash to jade mist */
.kn-horizon{background:linear-gradient(rgba(251,248,239,0),var(--kn-sun) 55%,var(--kn-jade-mist));padding:160px 0 120px;text-align:center}
.kn-horizon h2{font-size:60px;line-height:1.1;max-width:832px;margin:0 auto 24px}
.kn-horizon p{margin:0 auto 32px;max-width:576px;color:var(--kn-body);font-size:19px;line-height:1.55}
.kn-pill{display:inline-flex;gap:8px;padding:8px;border-radius:9999px;border:1px solid var(--kn-line-strong);background:var(--kn-white)}
.kn-pill a{display:inline-flex;align-items:center;height:48px;padding:0 28px;border-radius:9999px;font-weight:500;font-size:15px;transition:background .25s}
.kn-pill a:first-child{background:var(--kn-jade);color:var(--kn-white)}
.kn-pill a:first-child:hover{background:var(--kn-jade-deep)}
.kn-pill a:last-child{color:var(--kn-jade-deep)}
.kn-pill a:last-child:hover{background:var(--kn-jade-mist)}

/* colophon footer on jade mist */
.kn-colophon{background:var(--kn-jade-mist);color:var(--kn-ink);text-align:center;padding:64px var(--kn-pad) 40px}
.kn-colophon--spaced{margin-top:96px}
.kn-seal{width:132px;height:132px;margin:0 auto 20px;color:var(--kn-gold)}
.kn-colophon h2{font:italic 500 42px/1.25 var(--kn-serif);color:var(--kn-jade-deep)}
.kn-motto{margin:4px 0 0;font:500 19px/1.25 var(--kn-serif);color:var(--kn-gold-ink)}
.kn-util{max-width:var(--kn-wrap);margin:72px auto 0;display:grid;grid-template-columns:2fr 1fr 1fr;gap:48px;text-align:left;font:400 15px/1.55 var(--kn-sans)}
.kn-util h3{font:600 12px/1.25 var(--kn-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--kn-jade-deep);margin-bottom:20px}
.kn-util ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.kn-util a{transition:color .2s}
.kn-util a:hover{color:var(--kn-jade)}
.kn-legal{max-width:var(--kn-wrap);margin:40px auto 0;padding-top:24px;border-top:1px solid var(--kn-jade-soft);text-align:left;font:400 13px/1.5 var(--kn-sans);color:var(--kn-muted)}

/* responsive */
@media (max-width:1023px){
  .kn-stage .kn-wrap{grid-template-columns:1fr;gap:32px}
  .kn-buy{position:static}
  .kn-buy h1{font-size:44px}

/* ==========================================================================
   Mở rộng cho trang động (storefront chức năng)

   Mỗi nhóm dùng lại token v2: nền kem/trắng/ngọc nhạt, viền --kn-line, bo 10/20/viên thuốc, không đổ bóng.

/* page shell: skip link, page body, form helpers */

textarea.kn-input{height:auto;min-height:140px;padding:14px 16px;line-height:1.5;resize:vertical}
/* Select: native arrow removed, chevron drawn from tokens 16px from the right edge, text kept clear of it */
select.kn-input,.kn-select{appearance:none;-webkit-appearance:none;padding-right:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;background-color:var(--kn-white);background-image:linear-gradient(45deg,transparent 50%,var(--kn-jade-deep) 50%),linear-gradient(135deg,var(--kn-jade-deep) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}

select.kn-input:disabled,.kn-select:disabled{background-color:var(--kn-line);cursor:not-allowed;background-image:linear-gradient(45deg,transparent 50%,var(--kn-muted) 50%),linear-gradient(135deg,var(--kn-muted) 50%,transparent 50%)}
label.kn-field{font-size:13px;color:var(--kn-body)}
.kn-btn--wide{width:100%}
[data-kn-state]:empty{display:none}
.kn-stage [data-kn-state]{grid-column:1/-1}
.kn-shot:empty{display:none}
.kn-scroll{overflow-x:auto}

/* storefront chrome: tool icons, search bar, drawer, scrim */
.kn-nav__tools{display:flex;align-items:center;gap:4px}

.kn-drawer{position:fixed;top:0;left:0;bottom:0;z-index:31;width:min(360px,88vw);padding:24px 28px;overflow-y:auto;background:var(--kn-white);border-right:1px solid var(--kn-line);transform:translateX(-100%);visibility:hidden;transition:transform .25s,visibility .25s}
