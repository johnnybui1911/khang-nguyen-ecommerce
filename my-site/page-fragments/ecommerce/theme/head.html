<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
:root{--sw-bg:#F0EEE4;--sw-ink:#000;--sw-white:#fff;--sw-badge:#383735;--sw-line:#d9d6c9;--sw-sans:"Helvetica Neue",Arial,sans-serif;--sw-serif:Georgia,"Times New Roman",serif;--sw-pad:24px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
.sw{background:var(--sw-bg);color:var(--sw-ink);font:400 14px/1.45 var(--sw-sans);-webkit-font-smoothing:antialiased}
.sw a{color:inherit;text-decoration:none}
.sw img{display:block;max-width:100%;height:auto}
.sw h1,.sw h2,.sw h3{font-family:var(--sw-serif);font-weight:400;margin:0}
.sw h1{font-size:47px;line-height:1.15}
.sw h2{font-size:30px;line-height:1.2}
.sw button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.sw :focus-visible{outline:2px solid #000;outline-offset:2px}
.sw-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sw-u{text-decoration:underline;text-underline-offset:4px}
.sw a.sw-btn,.sw button.sw-btn,.sw-btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;min-width:230px;padding:0 24px;background:#fff;color:#000;border:1px solid #000}
.sw a.sw-btn--dark,.sw button.sw-btn--dark,.sw-btn--dark{background:#000;color:#fff}
.sw-grid{display:grid;gap:24px;grid-template-columns:repeat(4,1fr);padding:0 var(--sw-pad)}
.sw-acc{border-top:1px solid var(--sw-line)}
.sw-acc-item{border-bottom:1px solid var(--sw-line)}
.sw-acc-btn{display:flex;width:100%;justify-content:space-between;align-items:center;padding:18px 0;text-align:left;font-size:16px}
.sw-acc-btn::after{content:"+";font-size:22px;line-height:1}
.sw-acc-btn[aria-expanded="true"]::after{content:"\2212"}
.sw-acc-panel{display:none;padding:0 0 18px;max-width:720px}
.sw-acc-btn[aria-expanded="true"]+.sw-acc-panel{display:block}
/* promo + utility + header */
.sw-promo{display:flex;justify-content:center;align-items:center;gap:16px;background:#000;color:#fff;min-height:40px;padding:0 48px;position:relative;text-align:center}
.sw-promo.is-closed{display:none}
.sw-promo-x{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:32px;height:32px;color:#fff;font-size:22px}
.sw-util{display:flex;justify-content:space-between;align-items:center;padding:8px var(--sw-pad);font-size:12px;background:#fff}
.sw-util-mid{text-align:center}
.sw-util-r{display:flex;gap:20px}
.sw-bar{display:flex;align-items:center;justify-content:space-between;height:59px;padding:0 var(--sw-pad);background:#fff;border-bottom:1px solid var(--sw-line)}
.sw-bar-l,.sw-bar-r{display:flex;align-items:center;gap:20px;flex:1}
.sw-bar-r{justify-content:flex-end}
.sw-menu-btn{display:flex;align-items:center;gap:8px}
.sw-logo{display:block;line-height:0}
.sw-logo svg{height:20px;width:auto}
.sw-ico{position:relative;display:inline-flex;width:32px;height:32px;align-items:center;justify-content:center}
.sw-ico svg{width:22px;height:22px}
.sw-badge{position:absolute;top:0;right:-2px;min-width:16px;height:16px;border-radius:8px;background:var(--sw-badge);color:#fff;font-size:10px;line-height:16px;text-align:center}
.sw-home .sw-util,.sw-home .sw-bar{position:absolute;left:0;right:0;background:transparent;color:#fff;border-color:transparent;z-index:5}
.sw-home .sw-util{top:40px}
.sw-home .sw-bar{top:75px}
.sw-home .sw-promo.is-closed~.sw-util{top:0}
.sw-home .sw-promo.is-closed~.sw-bar{top:35px}
.sw-home{position:relative}
/* drawer */
.sw-scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .2s;z-index:90}
.sw-drawer{position:fixed;top:0;left:0;bottom:0;width:400px;max-width:100%;background:#fff;color:#000;transform:translateX(-100%);transition:transform .25s;z-index:100;overflow:auto;padding:16px 24px 32px;visibility:hidden}
.sw-drawer-open .sw-drawer{transform:none;visibility:visible}
.sw-drawer-open .sw-scrim{opacity:1;visibility:visible}
.sw-drawer-x{width:32px;height:32px;font-size:24px;margin-bottom:8px}
.sw-drawer ul{list-style:none;margin:0 0 24px;padding:0}
.sw-drawer li a{display:block;padding:12px 0;font:400 22px/1.2 var(--sw-serif)}
.sw-drawer .sw-sec li a{font:400 14px/1.4 var(--sw-sans);padding:8px 0}
.sw-drawer-meta{border-top:1px solid var(--sw-line);padding-top:16px;font-size:13px}
/* footer */
.sw-foot{background:#fff;margin-top:64px}
.sw-svc{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--sw-line)}
.sw-svc a{padding:28px var(--sw-pad);border-right:1px solid var(--sw-line)}
.sw-svc a:last-child{border-right:0}
.sw-svc strong{display:block;font-size:12px;letter-spacing:.08em;margin-bottom:6px}
.sw-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:40px var(--sw-pad)}
.sw-cols h3{font:600 14px/1.3 var(--sw-sans);margin-bottom:12px}
.sw-cols ul{list-style:none;margin:0;padding:0}
.sw-cols li a{display:block;padding:4px 0;color:#383735}
.sw-bottom{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:24px var(--sw-pad);border-top:1px solid var(--sw-line);flex-wrap:wrap}
.sw-bottom .sw-soc{display:flex;gap:16px;align-items:center}
.sw-bottom .sw-soc a{display:inline-flex;width:32px;height:32px;align-items:center;justify-content:center;border:1px solid #000;border-radius:50%;font-size:11px}
.sw-pill{border:1px solid #000;padding:8px 16px;border-radius:20px}
/* category strip */
.sw-strip{padding:48px var(--sw-pad);text-align:center}
.sw-strip ul{list-style:none;margin:24px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;max-width:960px;margin-inline:auto}
.sw-strip .sw-dot{display:flex;width:140px;height:140px;margin:0 auto 12px;border-radius:50%;background:#fff;align-items:center;justify-content:center}
.sw-strip .sw-dot svg{width:56px;height:56px}
.sw-strip a{display:block}
.sw-strip .sw-all{display:inline-block;margin-top:24px}
@media (max-width:1023px){.sw h1{font-size:34px}.sw h2{font-size:26px}.sw-grid{grid-template-columns:repeat(3,1fr)}.sw-cols{grid-template-columns:repeat(2,1fr)}}
@media (max-width:767px){
:root{--sw-pad:16px}
.sw h1{font-size:28px}.sw h2{font-size:22px}
.sw-grid{grid-template-columns:repeat(2,1fr);gap:16px}
.sw-util-l,.sw-util-r{display:none}.sw-util{justify-content:center}
.sw-bar-l span.sw-lbl{display:none}
.sw-svc{grid-template-columns:1fr}.sw-svc a{border-right:0;border-bottom:1px solid var(--sw-line)}
.sw-cols{grid-template-columns:1fr;padding:24px var(--sw-pad)}
.sw-strip ul{grid-template-columns:repeat(2,1fr)}
.sw-strip .sw-dot{width:112px;height:112px}
.sw a.sw-btn,.sw button.sw-btn,.sw-btn{min-width:0;width:100%}
.sw-home .sw-util{top:40px}
.sw-home .sw-bar{top:72px}
}
</style>
