<script>
/* Menu drawer and search toggle for pages that do not load the storefront script. */
document.addEventListener('DOMContentLoaded', function () {
  var d = document;
  if (d.documentElement.dataset.knChrome) { return; }
  var drawer = d.getElementById('swDrawer');
  var menuBtn = d.querySelector('[data-kn-menu]');
  function openDrawer(open) {
    d.body.classList.toggle('kn-drawer-open', open);
    if (drawer) { drawer.setAttribute('aria-hidden', open ? 'false' : 'true'); }
    if (menuBtn) { menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false'); }
  }
  if (menuBtn) { menuBtn.addEventListener('click', function () { openDrawer(true); }); }
  d.querySelectorAll('[data-kn-close]').forEach(function (n) { n.addEventListener('click', function () { openDrawer(false); }); });
  d.addEventListener('keydown', function (e) { if (e.key === 'Escape') { openDrawer(false); } });
  var searchBtn = d.querySelector('[data-kn-search-toggle]');
  var searchForm = d.getElementById('swSearch');
  if (searchBtn && searchForm) {
    searchBtn.addEventListener('click', function () {
      searchForm.hidden = !searchForm.hidden;
      searchBtn.setAttribute('aria-expanded', searchForm.hidden ? 'false' : 'true');
    });
  }
});
</script>
