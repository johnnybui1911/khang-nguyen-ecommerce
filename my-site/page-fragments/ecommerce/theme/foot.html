<script>
/* Menu drawer, search toggle and newsletter form for pages that do not load the storefront script. */
document.addEventListener('DOMContentLoaded', function () {
  var d = document;
  if (d.body.dataset.knChrome) { return; }
  var drawer = d.getElementById('swDrawer');
  var menuBtn = d.querySelector('[data-kn-menu]');
  function openDrawer(open) {
    d.body.classList.toggle('kn-drawer-open', open);
    if (drawer) { drawer.setAttribute('aria-hidden', open ? 'false' : 'true'); }
    if (menuBtn) { menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false'); }
  }
  if (menuBtn) { menuBtn.addEventListener('click', function () { openDrawer(true); }); }
  d.querySelectorAll('[data-kn-close]').forEach(function (n) { n.addEventListener('click', function () { openDrawer(false); }); });
  d.addEventListener('keydown', function (e) { if (e.key === 'Escape') { openDrawer(false); } });
  var searchBtn = d.querySelector('[data-kn-search-toggle]');
  var searchForm = d.getElementById('swSearch');
  if (searchBtn && searchForm) {
    searchBtn.addEventListener('click', function () {
      searchForm.hidden = !searchForm.hidden;
      searchBtn.setAttribute('aria-expanded', searchForm.hidden ? 'false' : 'true');
    });
  }
  var news = d.getElementById('swNewsForm');
  if (news) {
    var newsErr = d.getElementById('swNewsErr');
    var newsOk = d.getElementById('swNewsOk');
    var newsBtn = d.getElementById('swNewsBtn');
    news.addEventListener('submit', function (e) {
      e.preventDefault();
      newsErr.hidden = true;
      newsOk.hidden = true;
      var input = news.elements.email;
      var email = input.value.trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        newsErr.textContent = 'Nhập địa chỉ email hợp lệ.';
        newsErr.hidden = false;
        input.setAttribute('aria-invalid', 'true');
        input.focus();
        return;
      }
      input.removeAttribute('aria-invalid');
      newsBtn.disabled = true;
      fetch('/api/v1/ecm/newsletter', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {'Accept': 'application/json, text/plain, */*', 'Content-Type': 'application/json', 'X-Requested-With': 'ecm'},
        body: JSON.stringify({email: email, website: news.elements.website.value})
      }).then(function (res) {
        if (!res.ok) { throw res.status; }
        news.reset();
        newsOk.textContent = 'Cảm ơn bạn đã đăng ký. Vui lòng kiểm tra hộp thư để xác nhận địa chỉ email.';
        newsOk.hidden = false;
      }).catch(function (status) {
        newsErr.textContent = status === 429 ? 'Bạn gửi quá nhiều yêu cầu. Vui lòng đợi một phút rồi thử lại.'
          : status === 400 ? 'Nhập địa chỉ email hợp lệ.' : 'Chưa đăng ký được. Vui lòng thử lại.';
        newsErr.hidden = false;
      }).then(function () { newsBtn.disabled = false; });
    });
  }
});
</script>
