<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{page}">
<head></head>
<body>
<th:block layout:fragment="content">
<div id="swMain" class="sw-main sw-auth" tabindex="-1">
  <h1>Sign in</h1>
  <form class="sw-form" id="swAuthForm" data-mode="login" novalidate>
    <label>Username<input name="username" required autocomplete="username"></label>
    
    <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
    <p class="sw-form-err" id="swFormErr" role="alert" hidden></p>
    <button type="submit" class="sw-btn sw-btn--dark sw-wide" id="swAuthBtn">Sign in</button>
  </form>
  <p class="sw-alt"><a class="sw-u" href="/forgot-password">Forgot your password?</a></p>
  <p class="sw-alt">New to Khang Nguyen? <a class="sw-u" href="/register" data-sw-next-link>Create an account</a></p>
</div>
</th:block>
</body>
</html>
