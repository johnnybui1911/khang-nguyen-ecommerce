<!DOCTYPE html>
<html lang="vi" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{page}">
<head><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>
<th:block layout:fragment="content">
<div class="kn-auth" id="knMain" tabindex="-1">
  <h1>Đặt <em>mật khẩu mới</em></h1>
  <form class="kn-form" id="knResetForm" novalidate>
    <div class="kn-field"><label for="f-password">Mật khẩu mới (ít nhất 8 ký tự)</label><input class="kn-input" id="f-password" name="password" type="password" required autocomplete="new-password" minlength="8" /></div>
    <div class="kn-field"><label for="f-confirm">Nhập lại mật khẩu mới</label><input class="kn-input" id="f-confirm" name="confirm" type="password" required autocomplete="new-password" /></div>
    <p class="kn-error" id="knFormErr" role="alert" hidden></p>
    <p class="kn-note" id="knFormOk" role="status" aria-live="polite" hidden></p>
    <button type="submit" class="kn-btn" id="knFormBtn">Lưu mật khẩu mới</button>
  </form>
  <p class="kn-alt"><a href="/forgot-password">Yêu cầu liên kết mới</a> &middot; <a href="/login">Đăng nhập</a></p>
</div>
</th:block>
</body>
</html>
