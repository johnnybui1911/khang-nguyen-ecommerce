<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{page}">
<head></head>
<body>
<th:block layout:fragment="content">
<div id="swMain" class="sw-main sw-auth" tabindex="-1">
  <h1>Choose a new password</h1>
  <form class="sw-form" id="swResetForm" novalidate>
    <label>New password<input name="password" type="password" required autocomplete="new-password" minlength="8"></label>
    <label>Confirm new password<input name="confirm" type="password" required autocomplete="new-password"></label>
    <p class="sw-form-err" id="swFormErr" role="alert" hidden></p>
    <p class="sw-note" id="swFormOk" role="status" aria-live="polite" hidden></p>
    <button type="submit" class="sw-btn sw-btn--dark sw-wide" id="swFormBtn">Save new password</button>
  </form>
  <p class="sw-alt"><a class="sw-u" href="/forgot-password">Request a new link</a> &middot; <a class="sw-u" href="/login">Sign in</a></p>
</div>
</th:block>
</body>
</html>
