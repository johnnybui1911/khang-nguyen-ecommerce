<!DOCTYPE html>
<html lang="vi" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{page}">
<head><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>
<th:block layout:fragment="content">
<div class="kn-narrow" id="knMain" tabindex="-1">
  <nav class="kn-crumb" aria-label="Đường dẫn"><a href="/">Trang chủ</a> / Tình trạng đơn hàng</nav>
  <div class="kn-page-title"><h1>Tình trạng <em>đơn hàng</em></h1><p>Nhập mã đơn hàng và địa chỉ email đã dùng khi đặt để xem đơn của bạn đang ở bước nào.</p></div>
  <form class="kn-form" id="knStatusForm" novalidate>
    <div class="kn-form__row">
      <div class="kn-field"><label for="knStatusId">Mã đơn hàng</label><input class="kn-input" id="knStatusId" name="orderId" type="text" inputmode="numeric" autocomplete="off" required /></div>
      <div class="kn-field"><label for="knStatusEmail">Email</label><input class="kn-input" id="knStatusEmail" name="email" type="email" autocomplete="email" required /></div>
    </div>
    <button type="submit" class="kn-btn kn-btn--inline" id="knStatusBtn">Kiểm tra</button>
  </form>
  <p class="kn-note" id="knStatusMsg" role="status" aria-live="polite"></p>
  <div>
    <dl class="kn-dl" id="knStatusResult" hidden>
      <dt>Đơn hàng</dt><dd id="knStatusOrder"></dd>
      <dt>Trạng thái</dt><dd id="knStatusValue"></dd>
      <dt>Ngày đặt</dt><dd id="knStatusPlaced"></dd>
      <dt>Cập nhật lần cuối</dt><dd id="knStatusUpdated"></dd>
    </dl>
  </div>
  <section class="kn-card" id="knStatusSummary" hidden aria-label="Tóm tắt đơn hàng">
    <h2>Sản phẩm</h2>
    <ul class="kn-mini" id="knStatusLines"></ul>
    <p class="kn-total"><span>Tổng cộng</span><strong id="knStatusTotal"></strong></p>
  </section>
</div>

</th:block>
</body>
</html>
