<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{page}">
<head></head>
<body>
<th:block layout:fragment="content">
<div id="swMain" class="sw-main sw-narrow" tabindex="-1">
  <h1>Shopping bag</h1>
  <div data-sw-state></div>
  <div class="sw-cart" id="swCart" hidden>
    <ul class="sw-lines" id="swLines"></ul>
    <aside class="sw-sum">
      <h2>Order summary</h2>
      <p class="sw-sum-row"><span>Subtotal</span><strong id="swSubtotal"></strong></p>
      <p class="sw-note">Shipping and taxes are calculated at checkout.</p>
      <a class="sw-btn sw-btn--dark sw-wide" href="/checkout">Checkout</a>
      <a class="sw-u" href="/products">Continue shopping</a>
    </aside>
  </div>
</div>
</th:block>
</body>
</html>
