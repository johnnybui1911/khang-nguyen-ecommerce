<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{page}">
<head></head>
<body>
<th:block layout:fragment="content">
<div id="swMain" class="sw-main sw-narrow" tabindex="-1">
  <nav class="sw-bc" aria-label="Breadcrumb"><a href="/">Home</a> / <a href="/stores">Stores</a> / <span>Book an appointment</span></nav>
  <div class="sw-top"><h1>Book an appointment</h1></div>
  <p>Choose a store and a time. The store will confirm your visit by email or phone.</p>
  <div data-sw-state></div>
  <form class="sw-form" id="swApptForm" novalidate hidden>
    <label>Store<select name="storeId" required></select></label>
    <p class="sw-form-err" data-err-for="storeId" role="alert" hidden></p>
    <label>Date<input name="date" type="date" required></label>
    <p class="sw-form-err" data-err-for="date" role="alert" hidden></p>
    <label>Time<select name="time" required></select></label>
    <p class="sw-form-err" data-err-for="time" role="alert" hidden></p>
    <label>Name<input name="name" required maxlength="100" autocomplete="name"></label>
    <p class="sw-form-err" data-err-for="name" role="alert" hidden></p>
    <label>Phone<input name="phone" type="tel" required autocomplete="tel"></label>
    <p class="sw-form-err" data-err-for="phone" role="alert" hidden></p>
    <label>Email<input name="email" type="email" required maxlength="254" autocomplete="email"></label>
    <p class="sw-form-err" data-err-for="email" role="alert" hidden></p>
    <label>Note (optional)<textarea name="note" maxlength="500" rows="3"></textarea></label>
    <p class="sw-form-err" data-err-for="note" role="alert" hidden></p>
    <div class="sw-hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
    <p class="sw-form-err" id="swFormErr" role="alert" hidden></p>
    <p class="sw-note" id="swFormOk" role="status" aria-live="polite" hidden></p>
    <button type="submit" class="sw-btn sw-btn--dark sw-wide" id="swFormBtn">Request appointment</button>
  </form>
</div>
</th:block>
</body>
</html>
