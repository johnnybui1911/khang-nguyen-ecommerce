<!DOCTYPE html>
<html lang="vi" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{page}">
<head><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>
<th:block layout:fragment="content">
<div class="kn-narrow" id="swMain" tabindex="-1">
  <nav class="kn-crumb" aria-label="Đường dẫn"><a href="/">Trang chủ</a> / <a href="/customer-service">Chăm sóc khách hàng</a> / Số dư thẻ quà tặng</nav>
  <div class="kn-page-title"><h1>Số dư <em>thẻ quà tặng</em></h1><p>Nhập số thẻ và mã PIN in trên thẻ quà tặng của bạn.</p></div>
  <form class="kn-form" id="swGiftForm" novalidate>
    <div class="kn-field"><label for="f-code">Số thẻ</label><input class="kn-input" id="f-code" name="code" required autocomplete="off" inputmode="numeric" /></div>
    <div class="kn-field"><label for="f-pin">Mã PIN</label><input class="kn-input" id="f-pin" name="pin" autocomplete="off" inputmode="numeric" /></div>
    <p class="kn-error" id="swGiftErr" role="alert" hidden></p>
    <p class="kn-note" id="swGiftResult" role="status" aria-live="polite"></p>
    <button type="submit" class="kn-btn kn-btn--inline">Kiểm tra số dư</button>
  </form>
  <p class="kn-alt"><a href="/customer-service">Về trang chăm sóc khách hàng</a></p>
</div>
</th:block>
</body>
</html>
