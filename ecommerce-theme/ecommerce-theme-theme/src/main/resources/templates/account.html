<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{page}">
<head></head>
<body>
<th:block layout:fragment="content">
<div id="swMain" class="sw-main sw-narrow" tabindex="-1">
  <h1>My account</h1>
  <div data-sw-state></div>
  <div id="swAccount" hidden>
    <section class="sw-card"><h2>Profile</h2><dl class="sw-dl" id="swProfile"></dl>
      <button type="button" class="sw-btn" id="swEditProfile" aria-expanded="false" aria-controls="swProfileForm">Edit profile</button>
      <button type="button" class="sw-btn" id="swLogout">Sign out</button>
      <form class="sw-form" id="swProfileForm" novalidate hidden>
        <h2>Edit profile</h2>
        <label>Display name<input name="displayName" autocomplete="name"></label>
        <p class="sw-form-err" data-err-for="displayName" role="alert" hidden></p>
        <label>Phone<input name="phone" type="tel" autocomplete="tel"></label>
        <p class="sw-form-err" data-err-for="phone" role="alert" hidden></p>
        <label>Birth date<input name="birthDate" type="date" autocomplete="bday"></label>
        <p class="sw-form-err" data-err-for="dateOfBirth" role="alert" hidden></p>
        <label>Address<input name="address" autocomplete="street-address"></label>
        <p class="sw-form-err" data-err-for="addressNumber" role="alert" hidden></p>
        <p class="sw-form-err" id="swProfileErr" role="alert" hidden></p>
        <p class="sw-note" id="swProfileOk" role="status" aria-live="polite" hidden>Saved</p>
        <button type="submit" class="sw-btn sw-btn--dark" id="swProfileSave">Save</button>
      </form></section>
    <section class="sw-card"><h2>Order history</h2>
      <p class="sw-note"><a class="sw-u" href="/order-status">Tra cứu đơn / Order Status</a></p>
      <div data-sw-orders-state></div>
      <table class="sw-orders" id="swOrders" hidden>
        <thead><tr><th scope="col">Order</th><th scope="col">Date</th><th scope="col">Status</th><th scope="col">Total</th></tr></thead>
        <tbody></tbody></table></section>
  </div>
</div>
</th:block>
</body>
</html>
