<!DOCTYPE html>
<html lang="vi" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{page}">
<head><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>
<th:block layout:fragment="content">
<div class="kn-narrow" id="knMain" tabindex="-1">
  <nav class="kn-crumb" aria-label="Đường dẫn"><a href="/">Trang chủ</a> / <a href="/customer-service">Chăm sóc khách hàng</a> / Liên hệ</nav>
  <div class="kn-page-title"><h1>Liên hệ <em>với chúng tôi</em></h1><p>Gửi tin nhắn cho đội ngũ chăm sóc khách hàng. Chúng tôi sẽ trả lời qua email.</p></div>
  <form class="kn-form" id="knContactForm" novalidate>
    <div class="kn-field"><label for="f-name">Họ và tên</label><input class="kn-input" id="f-name" name="name" required maxlength="100" autocomplete="name" /></div>
    <p class="kn-error" data-err-for="name" role="alert" hidden></p>
    <div class="kn-field"><label for="f-email">Email</label><input class="kn-input" id="f-email" name="email" type="email" required maxlength="254" autocomplete="email" /></div>
    <p class="kn-error" data-err-for="email" role="alert" hidden></p>
    <div class="kn-field"><label for="f-phone">Số điện thoại (nếu có)</label><input class="kn-input" id="f-phone" name="phone" type="tel" autocomplete="tel" /></div>
    <p class="kn-error" data-err-for="phone" role="alert" hidden></p>
    <div class="kn-field"><label for="f-topic">Chủ đề</label><select class="kn-input" id="f-topic" name="topic"><option value="order">Đơn hàng của tôi</option><option value="product">Một sản phẩm</option><option value="repair">Bảo dưỡng, sửa chữa</option><option value="other" selected>Nội dung khác</option></select></div>
    <div class="kn-field"><label for="f-message">Nội dung</label><textarea class="kn-input" id="f-message" name="message" required maxlength="2000" rows="6"></textarea></div>
    <p class="kn-error" data-err-for="message" role="alert" hidden></p>
    <div class="kn-hp" aria-hidden="true"><label for="f-website">Website</label><input class="kn-input" id="f-website" name="website" tabindex="-1" autocomplete="off" /></div>
    <p class="kn-error" id="knFormErr" role="alert" hidden></p>
    <p class="kn-note" id="knFormOk" role="status" aria-live="polite" hidden></p>
    <button type="submit" class="kn-btn kn-btn--inline" id="knFormBtn">Gửi tin nhắn</button>
  </form>
</div>
</th:block>
</body>
</html>
