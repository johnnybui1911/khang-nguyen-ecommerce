<!DOCTYPE html>
<html lang="vi" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{page}">
<head><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>
<th:block layout:fragment="content">
<div class="kn-auth" id="swMain" tabindex="-1">
  <h1>Tạo <em>tài khoản</em></h1>
  <form class="kn-form" id="swAuthForm" data-mode="register" novalidate>
    <div class="kn-field"><label for="f-username">Tên đăng nhập</label><input class="kn-input" id="f-username" name="username" required autocomplete="username" /></div>
    <div class="kn-field"><label for="f-email">Email</label><input class="kn-input" id="f-email" name="email" type="email" required autocomplete="email" /></div>
    <div class="kn-field"><label for="f-displayName">Tên hiển thị</label><input class="kn-input" id="f-displayName" name="displayName" autocomplete="name" /></div>
    <div class="kn-field"><label for="f-password">Mật khẩu (ít nhất 8 ký tự)</label><input class="kn-input" id="f-password" name="password" type="password" required autocomplete="new-password" minlength="8" /></div>
    <p class="kn-error" id="swFormErr" role="alert" hidden></p>
    <button type="submit" class="kn-btn" id="swAuthBtn">Tạo tài khoản</button>
  </form>
  <p class="kn-alt">Đã có tài khoản? <a href="/login" data-kn-next-link>Đăng nhập</a></p>
</div>
</th:block>
</body>
</html>
