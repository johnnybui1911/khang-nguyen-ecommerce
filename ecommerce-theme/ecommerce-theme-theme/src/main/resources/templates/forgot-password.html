<!DOCTYPE html>
<html lang="vi" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{page}">
<head><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>
<th:block layout:fragment="content">
<div class="kn-auth" id="knMain" tabindex="-1">
  <h1>Quên <em>mật khẩu</em></h1>
  <p>Nhập email của tài khoản. Nếu email đã đăng ký, chúng tôi sẽ gửi liên kết để bạn đặt mật khẩu mới.</p>
  <form class="kn-form" id="knForgotForm" novalidate>
    <div class="kn-field"><label for="f-email">Email</label><input class="kn-input" id="f-email" name="email" type="email" required autocomplete="email" /></div>
    <p class="kn-error" id="knFormErr" role="alert" hidden></p>
    <p class="kn-note" id="knFormOk" role="status" aria-live="polite" hidden></p>
    <button type="submit" class="kn-btn" id="knFormBtn">Gửi liên kết đặt lại</button>
  </form>
  <p class="kn-alt"><a href="/login">Quay lại đăng nhập</a></p>
</div>
</th:block>
</body>
</html>
