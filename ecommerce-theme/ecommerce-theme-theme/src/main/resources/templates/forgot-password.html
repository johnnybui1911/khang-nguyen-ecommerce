<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{page}">
<head></head>
<body>
<th:block layout:fragment="content">
<div id="swMain" class="sw-main sw-auth" tabindex="-1">
  <h1>Forgot your password?</h1>
  <p>Enter the email address of your account. If it is registered, we will send you a link to choose a new password.</p>
  <form class="sw-form" id="swForgotForm" novalidate>
    <label>Email<input name="email" type="email" required autocomplete="email"></label>
    <p class="sw-form-err" id="swFormErr" role="alert" hidden></p>
    <p class="sw-note" id="swFormOk" role="status" aria-live="polite" hidden></p>
    <button type="submit" class="sw-btn sw-btn--dark sw-wide" id="swFormBtn">Send reset link</button>
  </form>
  <p class="sw-alt"><a class="sw-u" href="/login">Back to sign in</a></p>
</div>
</th:block>
</body>
</html>
