<!DOCTYPE html>
<html lang="vi" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{page}">
<head><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>
<th:block layout:fragment="content">
<div class="kn-narrow" id="knMain" tabindex="-1">
  <nav class="kn-crumb" aria-label="Đường dẫn"><a href="/">Trang chủ</a> / Đơn hàng</nav>
  <div class="kn-page-title"><h1 id="knOrderTitle">Đơn hàng của bạn</h1></div>
  <div data-kn-state></div>
  <div id="knOrder" hidden>
    <section class="kn-card">
      <p id="knOrderStatus" role="status"></p>
      <dl class="kn-dl" id="knOrderMeta"></dl>
    </section>
    <section class="kn-card">
      <h2>Sản phẩm</h2>
      <ul class="kn-mini" id="knOrderLines"></ul>
      <p class="kn-total"><span>Tổng cộng</span><strong id="knOrderTotal"></strong></p>
    </section>
    <p><a class="kn-btn kn-btn--inline" href="/products">Tiếp tục xem sản phẩm</a> <a class="kn-link" href="/account">Xem tất cả đơn hàng</a> <a class="kn-link" id="knOrderTrack" href="/order-status">Tra cứu tình trạng đơn</a></p>
  </div>
</div>

</th:block>
</body>
</html>
